name: Build CDDA0F IPA
  
on:  
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
        - Release
        - Debug
  
jobs:  
  build:
    runs-on: macos-latest
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
          
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
          
    - name: Install CocoaPods
      run: |
        sudo gem install cocoapods
        pod --version
          
    - name: Install dependencies
      run: |
        pod install --repo-update
          
    - name: List available schemes
      run: |
        xcodebuild -project CDDA.xcodeproj -list
      
    - name: Build CDDA0F app directly
      run: |
        xcodebuild -project CDDA.xcodeproj \
                   -target CDDA0F \
                   -configuration ${{ github.event.inputs.configuration }} \
                   -destination generic/platform=iOS \
                   -derivedDataPath $PWD/build/DerivedData \
                   build \
                   CODE_SIGNING_ALLOWED=NO \
                   ENABLE_BITCODE=NO
      
    - name: Create IPA manually
      run: |
        mkdir -p build/Payload
        cp -r build/DerivedData/Build/Products/${{ github.event.inputs.configuration }}-iphoneos/CDDA0F.app build/Payload/
        cd build && zip -r CDDA0F.ipa Payload/
      
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: CDDA0F-${{ github.event.inputs.configuration }}
        path: build/*.ipa
        retention-days: 30
