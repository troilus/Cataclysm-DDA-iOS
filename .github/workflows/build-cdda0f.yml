name: Build CDDA0F IPA
  
on:
  push:
    branches:
      - 0.F
  workflow_dispatch:
      inputs:
        configuration:
          description: 'Build Configuration'
          required: true
          default: 'Release'
          type: choice
          options:
            - Release
            - Debug
        scheme:
          description: 'Build Scheme'
          required: true
          default: 'CDDA Release'
          type: choice
          options:
            - CDDA Release
            - CDDA Debug

jobs:
  build:
    runs-on: macos-latest
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Initialize worktrees  
      run: |  
        # 检查当前分支和文件结构  
        echo "Current branch: $(git branch --show-current)"  
        echo "Repository structure:"  
        ls -la  
          
        # 检查scripts目录  
        if [ -d "scripts" ]; then  
          echo "Scripts directory found:"  
          ls -la scripts/  
        else  
          echo "Scripts directory not found, proceeding with inline commands"  
        fi  
          
        # 直接执行worktree初始化  
        cd submodule/Cataclysm-DDA  
        git worktree add ../../worktree/Cataclysm-DDA/0.F 0.F-branch  
        cd ../..  
          
        # 验证创建成功  
        echo "Worktree created:"  
        ls -la worktree/Cataclysm-DDA/
        
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
          
    - name: Install CocoaPods
      run: |
        sudo gem install cocoapods
        pod --version
        
    - name: Install dependencies
      run: |
        pod install --repo-update
        
    - name: List available schemes
      run: |
        echo "=== Workspace Schemes ==="
        xcodebuild -workspace CDDA.xcworkspace -list
        
    - name: Build CDDA0F
      run: |
        xcodebuild -workspace CDDA.xcworkspace \
                   -scheme "${{ github.event.inputs.scheme }}" \
                   -configuration "${{ github.event.inputs.configuration }}" \
                   -destination 'generic/platform=iOS' \
                   -archivePath "$PWD/build/CDDA0F.xcarchive" \
                   archive \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   ENABLE_BITCODE=NO \
                   IPHONEOS_DEPLOYMENT_TARGET=12.0 \
                   ONLY_ACTIVE_ARCH=NO \
                   OTHER_CFLAGS="-DZ_HAVE_UNISTD_H=1 -DHAVE_UNISTD_H=1" \
                   GCC_PREPROCESSOR_DEFINITIONS="$(inherited) FT2_BUILD_LIBRARY=1"
                       
    - name: Create Export Options Plist
      run: |
        cat > exportOptions.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>release</string>
            <key>compileBitcode</key>
            <false/>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <false/>
        </dict>
        </plist>
        EOF
        
    - name: Export IPA
      run: |
        xcodebuild -exportArchive \
                   -archivePath $PWD/build/CDDA0F.xcarchive \
                   -exportPath $PWD/build \
                   -exportOptionsPlist exportOptions.plist
                     
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: CDDA0F-${{ github.event.inputs.configuration }}-unsigned
        path: build/*.ipa
        retention-days: 7
  
    - name: Upload dSYM
      uses: actions/upload-artifact@v4
      with:
        name: CDDA0F-dSYM
        path: build/CDDA0F.xcarchive/dSYMs/
        retention-days: 7
