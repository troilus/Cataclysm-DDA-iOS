name: Build CDDA0F IPA

on:
  push
    branches:
      - 0.F
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build Configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Install CocoaPods
      run: |
        sudo gem install cocoapods
        pod --version
        
    - name: Install dependencies
      run: |
        pod install --repo-update
        
    - name: List available schemes
      run: |
        echo "=== Workspace Schemes ==="
        xcodebuild -workspace CDDA.xcworkspace -list
        
    - name: Build CDDA0F
      run: |
        xcodebuild -project CDDA.xcodeproj \
                   -scheme CDDA Release \
                   -configuration ${{ github.event.inputs.configuration }} \
                   -destination 'generic/platform=iOS' \
                   -archivePath $PWD/build/CDDA0F.xcarchive \
                   archive \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   ENABLE_BITCODE=NO \
                   IPHONEOS_DEPLOYMENT_TARGET=12.0
                     
    - name: Create Export Options Plist
      run: |
        cat > exportOptions.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>release</string>
            <key>compileBitcode</key>
            <false/>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <false/>
        </dict>
        </plist>
        EOF
        
    - name: Export IPA
      run: |
        xcodebuild -exportArchive \
                   -archivePath $PWD/build/CDDA0F.xcarchive \
                   -exportPath $PWD/build \
                   -exportOptionsPlist exportOptions.plist
                     
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: CDDA0F-${{ github.event.inputs.configuration }}-unsigned
        path: build/*.ipa
        retention-days: 7

    - name: Upload dSYM
      uses: actions/upload-artifact@v4
      with:
        name: CDDA0F-dSYM
        path: build/CDDA0F.xcarchive/dSYMs/
        retention-days: 7
